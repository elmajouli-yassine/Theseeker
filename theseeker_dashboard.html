<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TheSeeker | Master Command Builder</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root { --primary: #00ff41; --bg: #0a0a0a; --card: #161616; --text: #d1d1d1; --danger: #ff4444; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); color: var(--text); padding: 20px; }
        .wrapper { max-width: 900px; margin: 20px auto; background: var(--card); border: 1px solid #333; border-radius: 12px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.7); }
        
        .header { background: #111; padding: 20px; border-bottom: 1px solid #333; display: flex; align-items: center; gap: 15px; }
        .header i { color: var(--primary); font-size: 2rem; }
        .header h1 { margin: 0; font-size: 1.2rem; letter-spacing: 2px; }

        .form-section { padding: 25px; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; }
        .input-group { margin-bottom: 10px; }
        .full-width { grid-column: span 3; }
        
        label { display: block; margin-bottom: 8px; font-size: 0.75rem; font-weight: bold; color: var(--primary); }
        input, select { 
            width: 100%; padding: 10px; background: #000; border: 1px solid #333; 
            color: #fff; border-radius: 4px; font-family: monospace; box-sizing: border-box;
        }
        
        /* Toggle Switch Styling */
        .switch-group { display: flex; align-items: center; gap: 10px; background: #222; padding: 10px; border-radius: 6px; cursor: pointer; }
        .switch-group input { width: auto; cursor: pointer; }
        .switch-label { font-size: 0.7rem; color: #aaa; cursor: pointer; }

        /* Terminal Preview */
        .terminal-zone { background: #000; padding: 25px; border-top: 1px solid #333; }
        .command-wrap { 
            background: #050505; padding: 20px; border-radius: 4px; border-left: 4px solid var(--primary);
            font-family: 'Courier New', monospace; position: relative; min-height: 40px;
        }
        .prompt { color: var(--primary); margin-right: 8px; }
        #command-text { color: #fff; font-size: 1rem; white-space: pre-wrap; word-break: break-all; }

        .copy-btn { 
            float: right; background: var(--primary); color: #000; border: none; 
            padding: 6px 15px; border-radius: 4px; font-weight: bold; cursor: pointer; 
            margin-bottom: 10px; transition: 0.2s;
        }
        .copy-btn:hover { background: #fff; }
    </style>
</head>
<body>

<div class="wrapper">
    <div class="header">
        <i class="fas fa-user-secret"></i>
        <div>
            <h1>THESEEKER_COMMAND_GEN</h1>
            <p style="margin:0; font-size: 0.7rem; color: #666;">v2.0 | Optimized for Terminal Interaction</p>
        </div>
    </div>

    <div class="form-section">
        <div class="input-group full-width">
            <label>Target URL (-u)</label>
            <input type="text" id="url" placeholder="https://example.com" oninput="gen()">
        </div>

        <div class="input-group">
            <label>Mode (-m)</label>
            <select id="mode" onchange="gen()">
                <option value="full">full</option>
                <option value="dirs">dirs</option>
                <option value="ml">ml</option>
            </select>
        </div>
        <div class="input-group">
            <label>Threads (-t)</label>
            <input type="number" id="threads" value="10" oninput="gen()">
        </div>
        <div class="input-group">
            <label>Output Dir (-o)</label>
            <input type="text" id="out" placeholder="results_target" oninput="gen()">
        </div>

        <div class="switch-group" onclick="toggle('noCewl')">
            <input type="checkbox" id="noCewl" onchange="gen()">
            <span class="switch-label">Disable CewL (--no-cewl)</span>
        </div>
        <div class="switch-group" onclick="toggle('noRedir')">
            <input type="checkbox" id="noRedir" onchange="gen()">
            <span class="switch-label">No Redirects (--no-redirects)</span>
        </div>
        <div class="input-group">
            <label>Extensions (-e)</label>
            <input type="text" id="ext" placeholder="php,txt" oninput="gen()">
        </div>
    </div>

    <div class="terminal-zone">
        <button class="copy-btn" onclick="copy()">COPY TO CLIPBOARD</button>
        <div style="clear:both;"></div>
        <div class="command-wrap">
            <span class="prompt">$</span><span id="command-text">./theseeker.sh -u https://example.com -m full -t 10</span>
        </div>
    </div>
</div>

<script>
    function toggle(id) {
        const el = document.getElementById(id);
        el.checked = !el.checked;
        gen();
    }

    function gen() {
        const url = document.getElementById('url').value || 'https://example.com';
        const mode = document.getElementById('mode').value;
        const threads = document.getElementById('threads').value;
        const out = document.getElementById('out').value;
        const ext = document.getElementById('ext').value;
        const noCewl = document.getElementById('noCewl').checked;
        const noRedir = document.getElementById('noRedir').checked;

        let cmd = `./theseeker.sh -u ${url} -m ${mode} -t ${threads}`;

        if (out) cmd += ` -o ${out}`;
        if (ext) cmd += ` -e ${ext}`;
        if (noCewl) cmd += ` --no-cewl`;
        if (noRedir) cmd += ` --no-redirects`;

        document.getElementById('command-text').innerText = cmd;
    }

    function copy() {
        const text = document.getElementById('command-text').innerText;
        navigator.clipboard.writeText(text).then(() => {
            const btn = document.querySelector('.copy-btn');
            btn.innerText = 'COPIED!';
            setTimeout(() => btn.innerText = 'COPY TO CLIPBOARD', 1500);
        });
    }

    // Init
    gen();
</script>

</body>
</html>
